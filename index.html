<!DOCTYPE html>
<html lang="en">
<head>

  <title>retv &mdash; Download for Linux</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="stage">

    <!-- LEFT: image field -->

      <img class="shot" src="screenshot-2.png" alt="retv settings window">
    </section>

    <!-- RIGHT: title + download -->
    <section class="panel">
      <h1 class="title">Download for Linux (V1.0)</h1>

      <a class="btn-2010" href="retv.zip" download="retv.zip">
        <span class="btn-icon" aria-hidden="true">&#10515;</span>
        <span class="btn-label">Download</span>
      </a>

      <p class="meta">retv.zip &middot; 64-bit &middot; ~12&nbsp;MB</p>

  </main>

  <script src="script.js"></script>
