<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>retv &mdash; Download for Linux</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card">

    <!-- LEFT: screenshot field -->
    <section class="gallery" aria-label="Screenshots of the program">
      <div class="slides">

        <div class="slide is-active">
          <img src="screenshot-1.png" alt="retv main window">
          <img src="screenshot-2.png" alt="retv settings window">
        </div>

        <div class="slide">
          <img src="screenshot-3.png" alt="retv playlist view">
          <img src="screenshot-4.png" alt="retv fullscreen view">
        </div>

      </div>

      <div class="dots" role="tablist" aria-label="Screenshot pages">
        <button class="dot is-active" data-slide="0" aria-label="Show screenshots 1 and 2"></button>
        <button class="dot" data-slide="1" aria-label="Show screenshots 3 and 4"></button>
      </div>
    </section>

    <!-- RIGHT: title + download -->
    <section class="panel">
      <h1 class="title">Download for Linux (V1.0)</h1>

      <a class="btn-2010" href="retv.zip" download="retv.zip">
        <span class="btn-icon" aria-hidden="true">&#10515;</span>
        <span class="btn-label">Download</span>
      </a>

      <p class="meta">retv.zip &middot; 64-bit &middot; ~12&nbsp;MB</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
